<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weplos Earn | Invest • Refer • Earn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070f;
      --bg-soft: #0e0e1a;
      --card: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f8;
      --muted: #9b9bb0;
      --primary: #7c5cff;
      --primary-2: #00e5c7;
      --accent: #ff6bcb;
      --gold: #ffc857;
      --gradient: linear-gradient(135deg, #7c5cff 0%, #00e5c7 50%, #ff6bcb 100%);
      --gradient-soft: linear-gradient(135deg, rgba(124,92,255,0.25), rgba(0,229,199,0.15));
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      --radius: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124, 92, 255, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0, 229, 199, 0.15), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(255, 107, 203, 0.12), transparent);
      pointer-events: none;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: -1;
      pointer-events: none;
      animation: float 18s ease-in-out infinite;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: var(--primary);
      top: -100px; left: -100px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: var(--primary-2);
      bottom: 10%; right: -80px;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 250px; height: 250px;
      background: var(--accent);
      top: 40%; left: 60%;
      animation-delay: -12s;
      opacity: 0.25;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .gradient-text {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .container {
      width: min(1140px, 92%);
      margin: 0 auto;
    }

    section {
      padding: 100px 0;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 18px 0;
      transition: all 0.35s ease;
    }
    nav.scrolled {
      background: rgba(7, 7, 15, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      text-decoration: none;
      color: var(--text);
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--gradient);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      box-shadow: 0 0 24px rgba(124, 92, 255, 0.45);
    }
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--gradient);
      color: #0a0a12;
      box-shadow: 0 8px 30px rgba(124, 92, 255, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124, 92, 255, 0.5);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-ghost:hover {
      background: var(--card);
      border-color: rgba(255,255,255,0.2);
    }
    .btn-lg {
      padding: 16px 32px;
      font-size: 1.05rem;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 100px;
      position: relative;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.15);
      border: 1px solid rgba(124, 92, 255, 0.3);
      color: #c4b5ff;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .hero-badge span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary-2);
      box-shadow: 0 0 10px var(--primary-2);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hero h1 {
      font-size: clamp(2.8rem, 5.5vw, 4.2rem);
      line-height: 1.08;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 36px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 48px;
    }
    .hero-stats {
      display: flex;
      gap: 40px;
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .hero-visual {
      position: relative;
    }
    .glass-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .glass-card::before {
      content: '';
      position: absolute;

      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    }
    .earn-card {
      transform: rotate(-2deg);
    }
    .earn-card:hover {
      transform: rotate(0deg) scale(1.02);
      transition: transform 0.4s ease;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--primary-2);
      background: rgba(0, 229, 199, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .balance {
      font-size: 2.4rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 4px;
    }
    .balance-sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill {
      height: 100%;
      width: 72%;
      background: var(--gradient);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(124, 92, 255, 0.5);
    }
    .mini-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mini-stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
    }
    .mini-stat .label {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .mini-stat .value {
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 4px;
    }
    .floating-badge {
      position: absolute;
      right: -20px;
      bottom: 40px;
      background: rgba(15, 15, 25, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      animation: bounce 4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .floating-badge .icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffc857, #ff6bcb);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }
    .floating-badge .text strong {
      display: block;
      font-size: 0.95rem;
    }
    .floating-badge .text span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .section-header {
      text-align: center;
      max-width: 560px;
      margin: 0 auto 60px;
    }
    .section-header .eyebrow {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .section-header h2 {
      font-size: clamp(1.9rem, 3.5vw, 2.6rem);
      margin-bottom: 14px;
    }
    .section-header p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .step-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      position: relative;
      transition: all 0.3s ease;
    }
    .step-card:hover {
      border-color: rgba(124, 92, 255, 0.4);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .step-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
      line-height: 1;
      margin-bottom: 16px;
    }
    .step-card h3 {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }
    .step-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .step-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--gradient-soft);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .plan-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .plan-card.featured {
      border-color: rgba(124, 92, 255, 0.5);
      background: linear-gradient(180deg, rgba(124,92,255,0.12), rgba(255,255,255,0.02));
      transform: scale(1.04);
      z-index: 2;
    }
    .plan-card:hover {
      transform: translateY(-8px);
    }
    .plan-card.featured:hover {
      transform: scale(1.04) translateY(-8px);
    }
    .plan-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gradient);
      color: #0a0a12;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .plan-name {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .plan-roi {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .plan-period {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .plan-features {
      list-style: none;
      margin-bottom: 28px;
      flex: 1;
    }
    .plan-features li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .plan-features li::before {
      content: '✓';
      color: var(--primary-2);
      font-weight: 700;
    }
    .plan-card .btn {
      width: 100%;
    }

    .referral-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    .network-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
    }
    .network-levels {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }
    .level {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }
    .level-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .level-1 .level-dot { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
    .level-2 .level-dot { background: var(--primary-2); box-shadow: 0 0 10px var(--primary-2); }
    .level-3 .level-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .level-info {
      flex: 1;
    }
    .level-info strong {
      display: block;
      font-size: 0.95rem;
    }
    .level-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .level-pct {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--gold);
    }
    .referral-content h2 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: 16px;
    }
    .referral-content p {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 1.05rem;
    }
    .commission-highlight {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
    }
    .comm-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .comm-box .num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .comm-box .lbl {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .feature {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 28px 22px;
      transition: all 0.3s;
    }
    .feature:hover {
      border-color: rgba(0, 229, 199, 0.3);
      transform: translateY(-4px);
    }
    .feature-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--gradient-soft);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      margin-bottom: 16px;
    }
    .feature h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
    }
    .feature p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .cta-section {
      padding: 40px 0 120px;
    }
    .cta-box {
      background: linear-gradient(135deg, rgba(124,92,255,0.2), rgba(0,229,199,0.1));
      border: 1px solid rgba(124, 92, 255, 0.3);
      border-radius: 32px;
      padding: 60px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .cta-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, rgba(124,92,255,0.2), transparent 60%);
      pointer-events: none;
    }
    .cta-box h2 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      margin-bottom: 14px;
      position: relative;
    }
    .cta-box p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 32px;
      position: relative;
    }
    .cta-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 48px 0 32px;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 32px;
      margin-bottom: 40px;
    }
    .footer-brand p {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 280px;
      margin-top: 12px;
    }
    .footer-links {
      display: flex;
      gap: 60px;
    }
    .footer-col h4 {
      font-size: 0.9rem;
      margin-bottom: 14px;
      color: var(--text);
    }
    .footer-col a {
      display: block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 8px;
      transition: color 0.2s;
    }
    .footer-col a:hover { color: var(--primary-2); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
      font-size: 0.85rem;
      color: var(--muted);
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; gap: 48px; }
      .hero-visual { max-width: 400px; margin: 0 auto; }
      .steps, .plans { grid-template-columns: 1fr; }
      .plan-card.featured { transform: none; }
      .plan-card.featured:hover { transform: translateY(-8px); }
      .referral-grid { grid-template-columns: 1fr; }
      .features-grid { grid-template-columns: 1fr 1fr; }
      .nav-links { display: none; }
      .menu-btn { display: block; }
    }
    @media (max-width: 560px) {
      .features-grid { grid-template-columns: 1fr; }
      .hero-stats { gap: 24px; }
      .commission-highlight { flex-direction: column; }
      .footer-links { gap: 32px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <nav id="nav">
    <div class="container nav-inner">
      <a href="#" class="logo">
        <div class="logo-mark">W</div>
        Weplos Earn
      </a>
      <ul class="nav-links">
        <li><a href="#how">How it works</a></li>
        <li><a href="#plans">Plans</a></li>
        <li><a href="#referral">Referral</a></li>
        <li><a href="#features">Features</a></li>
      </ul>
